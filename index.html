<head>

    <title>Turismo CWB</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

        a {
            text-decoration: none;
        }

        header {
            background-color: rgb(34, 85, 51); /* verde floresta */

        }

        .btn-abrir {
            color: rgb(245, 242, 240); /* branco */

        }

            background-color: rgb(34, 85, 51); /* verde floresta */
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            overflow-x: hidden;
            transition: width 0.3s;
        }

        nav a {
            color: rgb(245, 242, 240); /* branco */
            font-size: 25px;
            display: block;
            padding: 12px 10px 12px 32px;
        }

        nav a:hover {
            color: rgb(245, 242, 240); /* branco */
            background-color: rgb(101, 67, 33);
        }

        main {
            padding: 10px;
            transition: margin-left 0.5s;
            flex: 1;
        }

        footer p {
            margin: 0;
            padding: 10px;
        }

        .barra-rodape {
            height: 20px;
            background-color: rgb(34, 85, 51); /* mesmo verde floresta do topo e do menu */
        }
    </style>
</head>
